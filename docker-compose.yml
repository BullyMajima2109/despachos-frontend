
version: "3.9"

services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:

        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    container_name: despachos-frontend
    restart: unless-stopped
    ports:

      - "80:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8081}
    networks:
      - frontend-net

networks:
  frontend-net:
    driver: bridge
    name: frontend-network
