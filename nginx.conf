# ============================================================
# nginx.conf - Configuración del servidor web para el Frontend
# Sirve los archivos estáticos de React y actúa como proxy
# hacia el Backend para evitar problemas de CORS
# ============================================================

server {
    listen 8080;
    server_name _;

    # Directorio raíz de los archivos estáticos compilados
    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------
    # Configuración para React Router (SPA - Single Page App)
    # Sin esto, al refrescar /despachos daría 404
    # --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------
    # Proxy hacia el Backend
    # Cuando el frontend pida /backend/**, Nginx lo redirige
    # al contenedor del backend en el puerto 8081
    # BACKEND_URL se reemplaza según el entorno
    # --------------------------------------------------------
    location /backend/ {
        proxy_pass http://44.195.45.46:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Headers CORS
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    # --------------------------------------------------------
    # Caché para archivos estáticos (JS, CSS, imágenes)
    # --------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------------
    # Configuración de logs
    # --------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
